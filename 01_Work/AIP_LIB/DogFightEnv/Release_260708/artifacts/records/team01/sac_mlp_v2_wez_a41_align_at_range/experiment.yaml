name: team01_sac_mlp_v2_wez_a41_align_at_range
script: train_rllib

output: {name: team01, tag: sac_mlp_v2_wez_a41_align_at_range}

env:
  observation_mode: tactical16
  target_mode: loiter
  target_behavior_dll: AIP_BASE_target.dll
  reward_module: student.sac_moving_target_reward_v5
  max_engage_time: 15.0
  episode_step_limit: 900

env_config:
  step_ratio: 6
  min_altitude: 300.0
  control_surface_scale: 1.0
  residual_action: {enabled: true, baseline: [0.0, -0.15, 0.0, 0.0], scale: [1.0, 1.0, 1.0, 1.0]}
  ownship_randomization: {enabled: false}
  initial_scenario:
    mode: ref_old_random
    legacy_use_random_scenario: true
    legacy_use_first_scenario_only: false
    legacy_scenario_indices: [5]
    legacy_randomization:
      aircraft_radius_m: 100.0
      roll_deg: 5.0
      pitch_deg: 5.0
      heading_deg: 5.0
      shared_n_m: 4000.0
      shared_e_m: 4000.0
      shared_d_m: 1000.0
      target_distance_n_m: 300.0
      speed_mps: 50.0
      loiter_bank_deg_range: [40.0, 70.0]
  ownship: [1000.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 300.0]
  target: [6000.0, 0.0, -7000.0, 0.0, 0.0, 180.0, 300.0]
  wez: {angle_deg: 2.0, min_range_m: 152.4, max_range_m: 914.4}
  reward:
    step_penalty: -0.01
    survival_bonus: 0.05
    win_reward: 0.0
    loss_reward: -100.0
    ownship_crash_reward: -120.0
    target_crash_reward: 0.0
    timeout_reward: 0.0
    draw_reward: -10.0
    guard_fail_penalty: -100.0
    damage_scale: 100.0
    altitude_warning_m: 4000.0
    altitude_floor_m: 300.0
    altitude_risk_scale: 0.50
    dive_penalty_scale: 0.20
    dive_reference_deg: 45.0
    excess_bank_deg: 60.0
    excess_bank_scale: 0.05
    pursuit_scale: 0.0
    pursuit_half_angle_deg: 30.0
    pursuit_range_m: 3000.0
    altitude_hold_target_m: 7000.0
    altitude_hold_range_m: 4000.0
    altitude_hold_scale: 0.50
    level_pitch_scale: 0.10
    level_roll_scale: 0.05
    closure_scale: 0.30
    closure_reference_mps: 300.0
    alignment_scale: 0.30
    range_scale: 0.30
    range_reference_m: 8000.0
    wez_hold_scale: 3.0
    fine_alignment_scale: 0.50
    fine_alignment_reference_deg: 10.0
    moving_alignment_scale: 1.0
    moving_alignment_reference_deg: 20.0

algo:
  name: sac
  framework: torch
  lr: 3.0e-4
  actor_lr: 1.0e-5
  critic_lr: 3.0e-4
  alpha_lr: 1.0e-5
  gamma: 0.99
  train_batch_size: 256
  minibatch_size: 256
  tau: 0.005
  target_entropy: auto
  replay_buffer_capacity: 20000
  learning_starts: 500
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu

runtime:
  iterations: 30
  num_env_runners: 0
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 5
  save_native_checkpoint: false
  init_bundle: artifacts/models/team01/sac_mlp_v2_wez_a40_short_horizon/bundle_000050

dashboard: {enabled: true, logdir: artifacts/dashboard}
policy_probe: {enabled: true, interval: 5, steps: 4, print: true}
engagement_log: {enabled: false}
notes: "A41 15-second alignment training after -0.15 pitch baseline reached WEZ range; seek strict 2-degree hold."
