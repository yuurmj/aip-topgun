name: team01_sac_mlp_v2_full_geometry_wez_a363b_lstm_smoke_patched
script: train_rllib
output: {name: team01, tag: sac_mlp_v2_full_geometry_wez_a363b_lstm_smoke_patched}

env:
  observation_mode: tactical25
  target_mode: loiter
  target_behavior_dll: AIP_BASE_target.dll
  reward_module: student.sac_wez_sync_reward_v7
  max_engage_time: 20.0
  episode_step_limit: 1200

env_config:
  episode_seed_cycle: [1003, 1006]
  step_ratio: 6
  min_altitude: 300.0
  control_surface_scale: 1.0
  pursuit_guidance_residual:
    enabled: true
    residual_scale: [0.05, 0.05, 0.05, 0.05]
    max_bank_deg: 70.0
    heading_to_bank: 2.5
    roll_gain: 0.002
    pitch_gain: 0.05
    capture_pitch_gain: 0.3
    pitch_command_sign: -1.0
    rudder_gain: 0.0
    lead_time_s: 12.0
    brake_range_m: 1800.0
    brake_heading_error_deg: 10.0
    near_throttle_action: -1.0
    capture_range_m: 1100.0
    capture_heading_error_deg: 90.0
    capture_lead_time_s: 0.0
    capture_bank_scale: 0.15
  ownship_randomization: {enabled: false}
  initial_scenario:
    mode: ref_old_random
    legacy_use_random_scenario: true
    legacy_use_first_scenario_only: false
    legacy_scenario_indices: [5]
    legacy_randomization:
      aircraft_radius_m: 100.0
      roll_deg: 5.0
      pitch_deg: 5.0
      heading_deg: 5.0
      shared_n_m: 4000.0
      shared_e_m: 4000.0
      shared_d_m: 1000.0
      target_distance_n_m: 300.0
      speed_mps: 50.0
      loiter_bank_deg_range: [40.0, 70.0]
  wez: {angle_deg: 10.0, min_range_m: 152.4, max_range_m: 914.4}
  reward:
    ownship_crash_reward: -120.0
    timeout_reward: 0.0
    draw_reward: -10.0
    altitude_warning_m: 4000.0
    altitude_floor_m: 300.0
    altitude_risk_scale: 0.50
    dive_penalty_scale: 0.20
    excess_bank_deg: 70.0
    excess_bank_scale: 0.02
    pursuit_scale: 0.10
    wez_hold_scale: 50.0
    wez_progress_scale: 50.0
    wez_required_steps: 10
    wez_milestone_bonus: 80.0
    wez_miss_penalty: -20.0
    sync_range_m: 2000.0
    sync_ata_gate_deg: 30.0
    bank_match_scale: 1.0
    heading_match_scale: 1.0
    speed_match_scale: 1.0

algo:
  name: sac
  framework: torch
  lr: 3.0e-4
  actor_lr: 3.0e-5
  critic_lr: 3.0e-4
  alpha_lr: 1.0e-5
  gamma: 0.995
  train_batch_size: 256
  minibatch_size: 256
  tau: 0.005
  target_entropy: auto
  replay_buffer_capacity: 10000
  learning_starts: 200
  mlp: {enabled: true, fcnet_hiddens: [128], fcnet_activation: relu, head_fcnet_hiddens: [], head_fcnet_activation: relu}
  lstm: {enabled: true, scope: actor_only, cell_size: 64, max_seq_len: 8, prioritized_replay: true}

runtime:
  iterations: 3
  num_env_runners: 0
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 1
  save_native_checkpoint: false

dashboard: {enabled: true, logdir: artifacts/dashboard}
policy_probe: {enabled: true, interval: 1, steps: 8, print: true}
engagement_log: {enabled: false}
notes: "A363b reruns the three-iteration actor-only recurrent SAC smoke after applying and verifying the Ray 2.54 patch."
