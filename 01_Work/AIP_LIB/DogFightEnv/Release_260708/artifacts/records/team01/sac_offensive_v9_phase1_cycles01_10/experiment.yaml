    wez_progress_scale: 30.0
    wez_required_steps: 10
    wez_milestone_bonus: 100.0
    wez_miss_penalty: -20.0

algo:
  name: sac
  framework: torch
  lr: 3.0e-4
  actor_lr: 1.0e-4
  critic_lr: 3.0e-4
  alpha_lr: 1.0e-5
  gamma: 0.995
  train_batch_size: 256
  minibatch_size: 256
  tau: 0.005
  target_entropy: auto
  replay_buffer_capacity: 50000
  learning_starts: 512
  mlp: {enabled: true, fcnet_hiddens: [256, 256], fcnet_activation: relu, head_fcnet_hiddens: [], head_fcnet_activation: relu}

runtime:
  iterations: 10
  num_env_runners: 0
  num_envs_per_env_runner: 1
  rollout_fragment_length: 256
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 1
  save_native_checkpoint: true
  native_checkpoint_frequency: 5
  init_bundle: artifacts/models/team01/sac_mlp_v2_submission_a437_actor_a687_runtime

dashboard: {enabled: true, logdir: artifacts/dashboard}
policy_probe: {enabled: true, interval: 1, steps: 4, print: false}
engagement_log: {enabled: true, interval: 1, steps: 300, episodes: 1, print: true}
notes: "Feedback cycles 01-10: attack acquisition and one-sided WEZ geometry with guarded active BT."
