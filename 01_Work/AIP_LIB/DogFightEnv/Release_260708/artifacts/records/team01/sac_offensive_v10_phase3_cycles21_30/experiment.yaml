name: team01_sac_offensive_v10_phase3_cycles21_30
script: train_rllib
output: {name: team01, tag: sac_offensive_v10_phase3_cycles21_30}

env:
  observation_mode: tactical25
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  reward_module: student.sac_offensive_reward_v10
  max_engage_time: 40.0
  episode_step_limit: 2400

env_config:
  episode_seed_cycle: [90321, 90322, 90323, 90324, 90325, 90326, 90327, 90328, 90329, 90330, 90331, 90332]
  canonicalize_negative_target_bank: true
  step_ratio: 6
  min_altitude: 300.0
