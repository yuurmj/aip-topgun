  target_altitude_guard:
    enabled: true
    trigger_altitude_m: 3500.0
    release_altitude_m: 5000.0
    roll_level_gain: 0.02
    pull_up_action: -1.0
    throttle_action: 1.0
  pursuit_guidance_residual:
    enabled: true
    residual_scale: [0.40, 0.40, 0.30, 0.12]
    near_residual_scale: [0.60, 0.60, 0.45, 0.20]
    near_distance_m: 1500.0
    near_ata_deg: 35.0
    max_bank_deg: 75.0
    heading_to_bank: 2.5
    roll_gain: 0.002
    pitch_gain: 0.05
