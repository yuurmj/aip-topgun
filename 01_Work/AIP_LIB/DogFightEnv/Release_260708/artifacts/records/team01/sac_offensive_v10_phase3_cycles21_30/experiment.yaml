    legacy_randomization:
      aircraft_radius_m: 120.0
      roll_deg: 8.0
      pitch_deg: 6.0
      heading_deg: 8.0
      shared_n_m: 4000.0
      shared_e_m: 4000.0
      shared_d_m: 1000.0
      target_distance_n_m: 350.0
      speed_mps: 60.0
      ownship_speed_advantage_mps: -30.0
      loiter_bank_deg_range: [35.0, 75.0]
