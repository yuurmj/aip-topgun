name: team01_sac_mlp_v2_wez_a11_authority_100_conservative
script: train_rllib

output: {name: team01, tag: sac_mlp_v2_wez_a11_authority_100_conservative}

env:
  observation_mode: tactical16
  target_mode: loiter
  target_behavior_dll: AIP_BASE_target.dll
  reward_module: student.sac_wez_hold_reward_v4
  max_engage_time: 60.0
  episode_step_limit: 3600

env_config:
  step_ratio: 6
  min_altitude: 300.0
  control_surface_scale: 1.0
  ownship: [1000.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 350.0]
  target: [1950.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 200.0]
  target_loiter: {enabled: false, bank: 0.0, pitch: 0.0}
  ownship_randomization: {enabled: false, radius: 0.0, r_roll: 0.0, r_pitch: 0.0, r_heading: 0.0}
  wez: {angle_deg: 2.0, min_range_m: 152.4, max_range_m: 914.4}
  reward:
    step_penalty: -0.01
    survival_bonus: 0.05
    win_reward: 100.0
    loss_reward: -100.0
    ownship_crash_reward: -120.0
    target_crash_reward: 100.0
    timeout_reward: 0.0
    draw_reward: -10.0
    guard_fail_penalty: -100.0
    damage_scale: 100.0
    altitude_warning_m: 2000.0
    altitude_floor_m: 300.0
    altitude_risk_scale: 0.10
    dive_penalty_scale: 0.05
    dive_reference_deg: 45.0
    excess_bank_deg: 60.0
    excess_bank_scale: 0.02
    pursuit_scale: 0.0
    pursuit_half_angle_deg: 60.0
    pursuit_range_m: 8000.0
    altitude_hold_target_m: 7000.0
    altitude_hold_range_m: 3000.0
    altitude_hold_scale: 0.20
    level_pitch_scale: 0.20
    level_roll_scale: 0.05
    closure_scale: 0.30
    closure_reference_mps: 300.0
    alignment_scale: 0.15
    range_scale: 0.15
    range_reference_m: 8000.0
    wez_hold_scale: 2.0
    fine_alignment_scale: 0.50
    fine_alignment_reference_deg: 10.0

algo:
  name: sac
  framework: torch
  lr: 1.0e-4
  actor_lr: 1.0e-6
  critic_lr: 3.0e-4
  alpha_lr: 1.0e-5
  gamma: 0.999
  train_batch_size: 256
  minibatch_size: 256
  tau: 0.005
  target_entropy: auto
  replay_buffer_capacity: 10000
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu

runtime:
  iterations: 15
  num_env_runners: 0
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 5
  save_native_checkpoint: true
  native_checkpoint_frequency: 15
  init_bundle: artifacts/models/team01/sac_mlp_v2_wez_authority_train_warmstart_100_from_a7_015

dashboard: {enabled: true, logdir: artifacts/dashboard}
policy_probe: {enabled: true, interval: 5, steps: 4, print: true}
engagement_log: {enabled: false}
notes: "A11: conservative 100% SAC fine-tuning with actor_lr 1e-6 and separate critic/alpha rates."
