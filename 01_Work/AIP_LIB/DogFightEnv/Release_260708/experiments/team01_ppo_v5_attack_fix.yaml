name: team01_ppo_v5_attack_fix
script: train_rllib

output:
  name: team01
  tag: ppo_mlp_v5_attack_fix

env:
  observation_mode: tactical16

  target_mode: fixed
  target_behavior_dll: AIP_BASE_target.dll

  reward_module: student.my_reward

  max_engage_time: 60.0
  episode_step_limit: 3600

env_config:
  step_ratio: 6

algo:
  name: ppo
  framework: torch

  lr: 3.0e-4
  gamma: 0.99

  train_batch_size: 1024
  minibatch_size: 128

  gae_lambda: 0.95
  clip_param: 0.2

  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu

    head_fcnet_hiddens: []
    head_fcnet_activation: relu

    vf_share_layers: true

runtime:
  # 우선 30회만 시험
  iterations: 30

  num_env_runners: 1
  num_envs_per_env_runner: 1

  rollout_fragment_length: auto
  batch_mode: truncate_episodes

  save_lightweight_bundle: true
  lightweight_bundle_frequency: 10

  save_native_checkpoint: false
  native_checkpoint_frequency: 0

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 10
  steps: 4
  print: true

engagement_log:
  enabled: true

  # 10·20·30회 부근에서 평가 결과 저장
  interval: 10
  steps: 600
  episodes: 10
  print: true

notes: 'PPO v5 attack fix: stronger pursuit/WEZ/damage rewards and target-crash penalty, preserving v3 logging fields.'
