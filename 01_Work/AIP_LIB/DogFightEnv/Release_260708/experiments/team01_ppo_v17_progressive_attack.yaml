name: team01_ppo_v17_progressive_attack
script: train_curriculum

output:
  name: team01
  tag: ppo_mlp_v17_progressive_attack

env:
  observation_mode: tactical16
  reward_module: student.my_reward_v17

algo:
  name: ppo
  framework: torch
  # Very conservative fine-tuning to preserve the saved attack policy.
  lr: 2.0e-5
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.05

  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  num_env_runners: 1
  save_lightweight_bundle: true
  # The exact v16 total_iter=22 policy was not checkpointed. Start from the
  # best reliably saved attack-capable model instead.
  init_bundle: artifacts/curriculum/team01/ppo_mlp_v15_entry_attack_refine/stage_1_stable_wez_hold_and_attack_8s/final_bundle

curriculum:
  stages_module: student.my_curriculum_v17

policy_probe:
  enabled: true
  interval: 1
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 1
  steps: 220
  episodes: 4
  print: true

notes: >-
  v17 progresses attack distance in 100 m steps and saves a native checkpoint
  every iteration. It starts from the v15 Stage-1 attack-capable bundle because
  the exact best v16 total_iter=22 policy was not saved. Each stage rehearses
  only the immediately previous distance, not unrelated easy and hard scenarios.
  Falling below 6,700 m terminates the episode, while roll above 55 degrees is
  strongly penalized. WEZ entry alone has little value; low ATA, stable firing,
  actual target damage, and controlled 400-800 m range dominate the reward.
  train_curriculum.py and src/dogfight are not modified.
