name: team01_ppo_v23_general_bridge_step1
script: train_curriculum

output:
  name: team01
  tag: ppo_mlp_v23_general_bridge_step1

env:
  observation_mode: tactical16
  reward_module: student.my_reward_v23
  target_behavior_dll: AIP_BASE_target.dll

algo:
  name: ppo
  framework: torch
  # One small update: protect the validated v21 policy while adding a narrow
  # head-on/aspect bridge.
  lr: 5.0e-6
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.05

  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  num_env_runners: 1
  save_lightweight_bundle: true
  # Reset from the last independently validated model, not v22.
  restore_checkpoint: "C:/Users/Ran/Desktop/2026/aip-topgun/01_Work/AIP_LIB/DogFightEnv/Release_260708/artifacts/curriculum/team01/ppo_mlp_v21_900m_fire_cone_refine/stage_0_attack_refine_900m_fire_cone_8s/checkpoints/iter_0001"

curriculum:
  stages_module: student.my_curriculum_v23

policy_probe:
  enabled: true
  interval: 1
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 1
  steps: 420
  # One iteration only; use enough replays to see familiar-vs-new behavior.
  episodes: 30
  print: true

notes: >-
  v23 is a conservative general-dogfight bridge step that restarts from the
  validated v21 iter_0001 native checkpoint. The reward logic is intentionally
  unchanged from v22 general-dogfight reward so this experiment isolates the
  curriculum/update-size change. Familiar states dominate: 50% validated 900 m
  autopilot rehearsal plus 20% 900 m tail chase against AIP_BASE_target.dll.
  New geometry is limited to 20% alpha 0 and 10% mirrored alpha 20; alpha 40/60
  are absent. Perturbations are much smaller than v22. PPO uses lr=5e-6,
  clip_param=0.05, and exactly one iteration. Success requires preserving useful
  900 m damage while beginning to survive/reacquire after alpha 0/20 merges.
